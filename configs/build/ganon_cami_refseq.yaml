name: ganon-cami-refseq
tool: ganon
db_prefix: DB/cami_refseq
threads: 32
tool_config:
  env: ganon
  bin: ganon
build:
  mode: custom
  # One row per library genome (file, accession, library taxid); species-level targets,
  # the default level of `ganon build`.
  target_tsv: /mnt/sda/CommonData/TaxonomyDataset/CAMIRefseq/target.tsv
  level: species
  taxonomy_files:
    - /mnt/sda/tianqinzhong/code/Chimera/third_party/ChimeraBenchmark/resources/taxonomy/ncbi_20260408/nodes.dmp
    - /mnt/sda/tianqinzhong/code/Chimera/third_party/ChimeraBenchmark/resources/taxonomy/ncbi_20260408/names.dmp
  args:
    # Genome sizes only rescale the taxonomic-abundance report; the evaluated sequence
    # abundance does not use them, and skipping avoids downloading NCBI size tables.
    - --skip-genome-size
